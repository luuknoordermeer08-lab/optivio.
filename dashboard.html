
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optivio | Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f3f6fb;
  color: #17243b;
  font-family: Arial, sans-serif;
}

header {
  background: white;
  border-bottom: 1px solid #e5eaf1;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  color: #1769e0;
}

button {
  border: 0;
  background: #1769e0;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled { opacity: .6; }

.container {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 22px;
}

.welcome {
  margin-bottom: 30px;
}

.welcome h1 {
  margin-bottom: 8px;
  font-size: 30px;
}

.muted {
  color: #718096;
}

.panel {
  background: white;
  padding: 26px;
  border-radius: 14px;
  margin-bottom: 22px;
  box-shadow: 0 4px 20px #00000008;
}

.panel h2 {
  margin-top: 0;
}

.status {
  padding: 13px;
  background: #eaf2ff;
  color: #1769e0;
  border-radius: 8px;
  font-size: 14px;
}

.record {
  border: 1px solid #e5eaf1;
  border-radius: 10px;
  padding: 16px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: monospace;
}

footer {
  text-align: center;
  color: #9aa5b5;
  padding: 35px;
  font-size: 12px;
}

@media(max-width:600px) {
  header { padding: 16px; }
  .container { margin-top: 25px; }
  .welcome h1 { font-size: 25px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">OPTIVIO.</div>
  <button id="logout">Uitloggen</button>
</header>

<main class="container">

  <div class="welcome">
    <h1>Dashboard</h1>
    <p class="muted">Welkom bij jouw beveiligde bedrijfsomgeving.</p>
  </div>

  <div class="panel">
    <h2>Accountstatus</h2>
    <div id="status" class="status">
      Beveiligde verbinding controleren...
    </div>
  </div>

  <div class="panel">
    <h2>Bedrijfsgegevens</h2>
    <p class="muted">De gegevens van jouw bedrijfsaccount.</p>
    <div id="gegevens">Gegevens laden...</div>
  </div>

</main>

<footer>
  © 2026 Optivio · Beveiligde klantomgeving
</footer>

<script>
const SUPABASE_URL =
  "https://vcgcowklqvfektlyzmia.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6LEmGg5LMjgNoHHJDYmzfg_vzKf13Ry";

const status = document.getElementById("status");
const gegevens = document.getElementById("gegevens");
const logout = document.getElementById("logout");

if (!window.supabase) {
  status.textContent = "Supabase kon niet worden geladen.";
  gegevens.textContent = "Ververs de pagina.";
} else {

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function startDashboard() {
    try {
      status.textContent = "Inlogsessie controleren...";

      const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

      if (sessionError) throw sessionError;

      if (!sessionData.session) {
        window.location.replace("/login.html");
        return;
      }

      const user = sessionData.session.user;

      status.textContent = "Toegang tot bedrijfsaccount controleren...";

      const { data: memberships, error: memberError } = await db
        .from("company_members")
        .select("company_id, role")
        .eq("user_id", user.id);

      if (memberError) throw memberError;

      if (!memberships || memberships.length === 0) {
        status.textContent = "Geen bedrijfsaccount gekoppeld.";
        gegevens.textContent =
          "Neem contact op met de beheerder om toegang te krijgen.";
        return;
      }

      const companyIds = memberships.map(
        membership => membership.company_id
      );

      const { data: records, error: dataError } = await db
        .from("company_data")
        .select("id, data, created_at")
        .in("company_id", companyIds)
        .order("created_at", { ascending: false });

      if (dataError) throw dataError;

      status.textContent = "Beveiligde verbinding actief.";

      if (!records || records.length === 0) {
        gegevens.textContent = "Er zijn nog geen bedrijfsgegevens opgeslagen.";
        return;
      }

      gegevens.innerHTML = "";

      records.forEach(record => {
        const card = document.createElement("div");
        card.className = "record";

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(record.data, null, 2);

        card.appendChild(pre);
        gegevens.appendChild(card);
      });

    } catch (error) {
      status.textContent = "Er is een probleem opgetreden.";
      gegevens.textContent = error.message;
    }
  }

  logout.addEventListener("click", async () => {
    logout.disabled = true;
    logout.textContent = "Uitloggen...";

    const { error } = await db.auth.signOut();

    if (error) {
      status.textContent = "Uitloggen mislukt: " + error.message;
      logout.disabled = false;
      logout.textContent = "Uitloggen";
      return;
    }

    window.location.replace("/login.html");
  });

  startDashboard();
}
</script>

</body>
</html>
